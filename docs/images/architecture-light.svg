<text class="l mono" x="640" y="218">job = service, as OBI</text>
<rect class="card" x="624" y="268" width="192" height="140" rx="10"/>
<text class="h" x="640" y="294">PostgreSQL</text>
<text class="m" x="640" y="316">whether a dependency</text>
<text class="m" x="640" y="334">exists: since when, until</text>
<text class="m" x="640" y="352">when, observed or not</text>
<text class="l mono" x="640" y="390">views of shawk_v1</text>
