<rect class="back" x="28" y="32" width="240" height="436" rx="10"/>
<rect class="back" x="22" y="38" width="240" height="436" rx="10"/>
<rect class="card" x="16" y="44" width="240" height="436" rx="10"/>
<text class="h" x="32" y="70">every host</text>
<text class="m" x="32" y="88">Linux with BTF</text>
<rect class="chip" x="32" y="104" width="64" height="30" rx="6"/>
<text class="c" x="64" y="123" text-anchor="middle">app</text>
<path class="flow" d="M64,134 V160" marker-end="url(#tip)"/>
<rect class="chip" x="104" y="104" width="64" height="30" rx="6"/>
<text class="c" x="136" y="123" text-anchor="middle">postgres</text>
<path class="flow" d="M136,134 V160" marker-end="url(#tip)"/>
<rect class="chip" x="176" y="104" width="64" height="30" rx="6"/>
<text class="c" x="208" y="123" text-anchor="middle">cron job</text>
<path class="flow" d="M208,134 V160" marker-end="url(#tip)"/>
<rect class="kernel" x="32" y="162" width="208" height="78" rx="8"/>
<text class="b" x="44" y="186">eBPF in the kernel</text>
<text class="m" x="44" y="206">TCP and UDP sockets,</text>
<text class="m" x="44" y="224">flows bundled per service</text>
<path class="flow" d="M136,240 V266" marker-end="url(#tip)"/>
<rect class="shawk" x="32" y="268" width="208" height="72" rx="8"/>
<text class="b mono" x="44" y="292">shawk agent</text>
<text class="m" x="44" y="312">processes → services</text>
<text class="m" x="44" y="330">no database, no open port</text>
<rect class="opt" x="32" y="384" width="208" height="72" rx="8"/>
<text class="b" x="44" y="408">OBI</text>
<text class="m" x="76" y="408">(optional)</text>
<text class="m" x="44" y="428">application layer:</text>
<text class="m" x="44" y="446">HTTP, gRPC, SQL, …</text>
<rect class="card" x="320" y="196" width="224" height="284" rx="10"/>
<text class="h" x="336" y="222">OpenTelemetry Collector</text>
<rect class="shawk" x="336" y="238" width="192" height="124" rx="8"/>
<text class="b mono" x="348" y="262">shawk connector</text>
<text class="m" x="348" y="284">dependencies, listeners,</text>
<text class="m" x="348" y="302">observation segments</text>
<text class="m" x="348" y="326">metrics per service,</text>
<text class="m" x="348" y="344">without addresses</text>
<rect class="opt" x="336" y="384" width="192" height="72" rx="8"/>
<text class="b" x="348" y="408">OBI pipelines</text>
<text class="m" x="348" y="428">metrics, traces</text>
<path class="flow" d="M240,304 H334" marker-end="url(#tip)"/>
<text class="l" x="288" y="296" text-anchor="middle">OTLP</text>
<text class="l" x="288" y="322" text-anchor="middle">every 15 s</text>
<path class="flow dash" d="M240,420 H334" marker-end="url(#tip)"/>
<text class="l" x="288" y="412" text-anchor="middle">OTLP</text>
<rect class="card" x="608" y="136" width="200" height="140" rx="10"/>
<text class="h" x="624" y="162">PostgreSQL</text>
<text class="m" x="624" y="184">whether a dependency exists:</text>
<text class="m" x="624" y="202">since when, until when,</text>
<text class="m" x="624" y="220">observed or not</text>
<text class="l mono" x="624" y="258">views of shawk_v1</text>
<rect class="card" x="608" y="316" width="200" height="140" rx="10"/>
<text class="h" x="624" y="342">Prometheus</text>
<text class="m" x="624" y="364">how much flows:</text>
<text class="m" x="624" y="382">connections, failures,</text>
<text class="m" x="624" y="400">bytes, RTT, retransmissions</text>
<text class="l mono" x="624" y="438">job = service name, as OBI</text>
<path class="flow" d="M528,272 H568 V206 H606" marker-end="url(#tip)"/>
<text class="l" x="587" y="198" text-anchor="middle">SQL</text>
<path class="flow" d="M528,336 H568 V378 H606" marker-end="url(#tip)"/>
<text class="l" x="587" y="370" text-anchor="middle">OTLP</text>
<path class="flow dash" d="M528,428 H606" marker-end="url(#tip)"/>
<rect class="card" x="848" y="186" width="140" height="220" rx="10"/>
<text class="h" x="864" y="212">Grafana</text>
<text class="c" x="864" y="238">Fleet</text>
<text class="c" x="864" y="258">Dependency map</text>
<text class="c" x="864" y="278">Dependency details</text>
<text class="c" x="864" y="298">Changes</text>
<text class="c" x="864" y="318">Application layer</text>
<text class="m" x="864" y="352">dashboards</text>
<text class="m" x="864" y="370">and alerts</text>
<path class="flow" d="M808,206 H828 V262 H846" marker-end="url(#tip)"/>
<path class="flow" d="M808,386 H828 V330 H846" marker-end="url(#tip)"/>
</svg>
