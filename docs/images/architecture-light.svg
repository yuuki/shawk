<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 492" width="1000" height="492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Architecture of shawk</title>
<desc id="desc">On every host, eBPF programs in the kernel trace the TCP connections of all processes and the shawk agent sends the bundled flows as OTLP metrics every 15 seconds to an OpenTelemetry Collector with the shawk connector. The connector writes dependencies, listeners and observation segments to PostgreSQL and aggregated metrics without addresses to Prometheus. Grafana shows both. OBI can send application-layer metrics to the same collector.</desc>
<style>
  .bg { fill: #ffffff; }
  .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  .back { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
  .chip { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .kernel { fill: #eaeef2; stroke: #d0d7de; stroke-width: 1; }
  .shawk { fill: #fdf0d9; stroke: #c98a1e; stroke-width: 1.5; }
  .opt { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 5 4; }
  .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
  .b { fill: #1f2328; font-size: 14px; font-weight: 600; }
  .m { fill: #59636e; font-size: 12px; }
  .c { fill: #1f2328; font-size: 12px; }
  .l { fill: #59636e; font-size: 11px; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .flow { fill: none; stroke: #59636e; stroke-width: 1.5; }
  .flow.dash { stroke-dasharray: 5 4; }
  .tip { fill: #59636e; }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker></defs>
