version: 2
project_name: shawk

before:
  hooks:
    # Generate the sources of the collector with the shawk connector, with
    # the version of the release; goreleaser compiles them below.
    - sh scripts/generate-collector.sh {{ .Version }}

builds:
  - id: shawk
    main: ./cmd/shawk
    binary: shawk
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yuuki/shawk/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  # The collector generated by the before hook (collector/_build).
  - id: shawk-collector
    dir: collector/_build
    main: .
    binary: shawk-collector
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: shawk-migrate
    dir: collector
    main: ./cmd/shawk-migrate
    binary: shawk-migrate
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: shawk
    ids: [shawk]
    name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - LICENSES/*
  - id: shawk-collector
    ids: [shawk-collector, shawk-migrate]
    name_template: "shawk-collector_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - packaging/collector/*
      - packaging/postgres/*
      - packaging/systemd/shawk-collector.service

changelog:
  disable: true

release:
  prerelease: auto

nfpms:
  - id: shawk
    ids: [shawk]
    package_name: shawk
    file_name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Yuuki TSUBOUCHI
    homepage: https://github.com/yuuki/shawk
    maintainer: Yuuki TSUBOUCHI <yuki.tsubo@gmail.com>
    description: Agent of shawk, which traces network dependencies among processes with eBPF and sends them over OTLP
    # The binary embeds the compiled eBPF programs.
    license: Apache-2.0 AND (GPL-2.0-only OR BSD-2-Clause)
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/shawk-agent.service
        dst: /usr/lib/systemd/system/shawk-agent.service
      - src: packaging/systemd/agent.env
        dst: /etc/shawk/agent.env
        type: config|noreplace
      - src: LICENSE
        dst: /usr/share/licenses/shawk/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/shawk/NOTICE
      - src: LICENSES/GPL-2.0-only.txt
        dst: /usr/share/licenses/shawk/GPL-2.0-only.txt
      - src: LICENSES/BSD-2-Clause.txt
        dst: /usr/share/licenses/shawk/BSD-2-Clause.txt

  - id: shawk-collector
    ids: [shawk-collector, shawk-migrate]
    package_name: shawk-collector
    file_name_template: "shawk-collector_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Yuuki TSUBOUCHI
    homepage: https://github.com/yuuki/shawk
    maintainer: Yuuki TSUBOUCHI <yuki.tsubo@gmail.com>
    description: OpenTelemetry Collector with the shawk connector, which keeps the dependencies traced by shawk agents in PostgreSQL and Prometheus
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/shawk-collector.service
        dst: /usr/lib/systemd/system/shawk-collector.service
      - src: packaging/collector/config.yaml
        dst: /etc/shawk/collector.yaml
        # No secrets here: the connection string is in postgres.dsn_file,
        # which the administrator creates readable by shawk-collector only.
        type: config|noreplace
      - src: packaging/postgres/setup.sql
        dst: /usr/share/shawk-collector/postgres/setup.sql
      - src: packaging/postgres/grants.sql
        dst: /usr/share/shawk-collector/postgres/grants.sql
      - src: LICENSE
        dst: /usr/share/licenses/shawk-collector/LICENSE
    scripts:
      preinstall: packaging/collector/preinstall.sh

dockers_v2:
  - id: shawk-collector
    ids: [shawk-collector, shawk-migrate]
    dockerfile: collector/Dockerfile
    images:
      - ghcr.io/yuuki/shawk-collector
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/yuuki/shawk
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.description: OpenTelemetry Collector with the shawk connector
