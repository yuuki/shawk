version: 2
project_name: shawk

builds:
  - id: shawk
    main: ./cmd/shawk
    binary: shawk
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/yuuki/shawk/internal/version.Version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - LICENSES/*

changelog:
  disable: true

release:
  prerelease: auto

nfpms:
  - id: shawk
    package_name: shawk
    file_name_template: "{{ .ProjectName }}_v{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Yuuki TSUBOUCHI
    homepage: https://github.com/yuuki/shawk
    maintainer: Yuuki TSUBOUCHI <yuki.tsubo@gmail.com>
    description: Agent of shawk, which traces network dependencies among processes with eBPF and sends them over OTLP
    # The binary embeds the compiled eBPF programs.
    license: Apache-2.0 AND (GPL-2.0-only OR BSD-2-Clause)
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/shawk-agent.service
        dst: /usr/lib/systemd/system/shawk-agent.service
      - src: packaging/systemd/agent.env
        dst: /etc/shawk/agent.env
        type: config|noreplace
      - src: LICENSE
        dst: /usr/share/licenses/shawk/LICENSE
      - src: NOTICE
        dst: /usr/share/licenses/shawk/NOTICE
      - src: LICENSES/GPL-2.0-only.txt
        dst: /usr/share/licenses/shawk/GPL-2.0-only.txt
      - src: LICENSES/BSD-2-Clause.txt
        dst: /usr/share/licenses/shawk/BSD-2-Clause.txt
