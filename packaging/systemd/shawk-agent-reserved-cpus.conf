# A drop-in for the agent on the compute nodes of an HPC cluster, whose
# tightly coupled jobs are sensitive to OS noise: it runs the user-space
# work of the agent (collecting the flows every interval, naming processes,
# exporting) on the CPUs that Slurm reserves for the system and keeps away
# from jobs (CpuSpecList or CoreSpecCount of the node in slurm.conf, with
# task/cgroup). Install it as
#
#   /etc/systemd/system/shawk-agent.service.d/reserved-cpus.conf
#
# with AllowedCPUs set to those CPUs as the kernel numbers them, then
# systemctl daemon-reload and restart the agent. CpuSpecList takes the
# abstract CPU ids of Slurm, which may differ from those of the kernel; with
# cgroup v2 Slurm confines slurmd to the reserved CPUs, so compare with
# cpuset.cpus.effective of its cgroup
# (/sys/fs/cgroup/system.slice/slurmd.service).
#
# The BPF programs are not confined: they run in the context of the
# applications whose connections change state, and of the agent when it
# walks the sockets. See docs/research/hpc-compute-nodes/compute_nodes.md
# for the measured effect.
[Service]
AllowedCPUs=0
