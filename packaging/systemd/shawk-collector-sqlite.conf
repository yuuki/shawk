# A drop-in for the collector in SQLite lightweight mode (without
# PostgreSQL; see packaging/collector/config-sqlite.yaml). Install it as
#
#   /etc/systemd/system/shawk-collector.service.d/sqlite.conf
#
# then run `systemctl daemon-reload` and restart shawk-collector.
#
# Under ProtectSystem=strict, StateDirectory=shawk-collector creates
# /var/lib/shawk-collector owned by shawk-collector and makes only that
# directory writable for the SQLite database (/var/lib/shawk-collector/shawk.db),
# its WAL files and its lock file.
[Service]
StateDirectory=shawk-collector
StateDirectoryMode=0750
