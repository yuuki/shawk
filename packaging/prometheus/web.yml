# Web configuration of Prometheus for shawk. Start Prometheus with
# --web.config.file=web.yml next to --web.enable-otlp-receiver.
#
# The OTLP receiver writes whatever series it is sent, shawk_agent_up
# included: whoever can push to Prometheus can silence the alerts on agents
# (shawk-rules.yml) and make up dependencies. With this file every endpoint
# of Prometheus, the OTLP receiver included, is served over TLS to the users
# below only. Prometheus does not tell readers from writers: every user can
# also push, so give each client its own user (the collector, Grafana,
# people, Prometheus itself if it scrapes itself).
tls_server_config:
  cert_file: /etc/prometheus/tls/prometheus.crt
  key_file: /etc/prometheus/tls/prometheus.key
  # To require client certificates instead of passwords, remove
  # basic_auth_users and set the two lines below. Every client then needs a
  # certificate, Grafana and the browsers of people included; the collector
  # sets tls.cert_file and tls.key_file instead of the Authorization header.
  # client_auth_type: RequireAndVerifyClientCert
  # client_ca_file: /etc/prometheus/tls/clients-ca.crt
basic_auth_users:
  # bcrypt hashes of the passwords, e.g. from htpasswd -nBC 12 '' | tr -d ':\n'.
  # Prometheus refuses to start until they are replaced.
  shawk-collector: BCRYPT-HASH
  grafana: BCRYPT-HASH
