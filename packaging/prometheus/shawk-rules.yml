# Recording rules and alerts for the metrics of shawk in Prometheus.
#
# Both ends of a dependency may run an agent, so a dependency shows up on
# the client side (shawk_role="client") and on the server side
# (shawk_role="server"). shawk_peer_agent tells whether the peer runs on a
# host with an agent, which then records the other side. The rules count
# each dependency once:
#
#   - connections, open connections, bytes, datagrams and RTT come from the
#     client side, and from the server side only when the client has no
#     agent (shawk_peer_agent="false");
#   - connection failures, handshakes and SYN retransmissions exist on the
#     client side only, which opens the connections;
#   - retransmissions come from both sides, since each side counts its own
#     retransmitted segments; shawk_role tells the sender.
#
# The two sides of an `or` never share a label set because they differ in
# shawk_role, so `or` is a union. The rules name the client src and the
# server dst, whichever side observed the dependency.
groups:
  - name: shawk-dependencies
    rules:
      - record: shawk:dependency_connections:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_connection_opened_total{shawk_role="client"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_connection_opened_total{shawk_role="server", shawk_peer_agent="false"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      - record: shawk:dependency_connection_failures:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
            label_replace(label_replace(
              rate(shawk_connection_failed_total{shawk_role="client"}[5m]),
              "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
          )

      - record: shawk:dependency_open_connections
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                shawk_connection_count{shawk_role="client"},
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                shawk_connection_count{shawk_role="server", shawk_peer_agent="false"},
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      # Bytes from the client to the server: transmitted by the client or
      # received by the server.
      - record: shawk:dependency_request_bytes:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_network_io_bytes_total{shawk_role="client", network_io_direction="transmit"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_network_io_bytes_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="receive"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      # Bytes from the server to the client.
      - record: shawk:dependency_response_bytes:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_network_io_bytes_total{shawk_role="client", network_io_direction="receive"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_network_io_bytes_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="transmit"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      - record: shawk:dependency_request_datagrams:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_udp_datagrams_total{shawk_role="client", network_io_direction="transmit"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_udp_datagrams_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="receive"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      - record: shawk:dependency_response_datagrams:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_udp_datagrams_total{shawk_role="client", network_io_direction="receive"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_udp_datagrams_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="transmit"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      # The mean RTT is rtt_sum / rtt_count.
      - record: shawk:dependency_rtt_seconds_sum:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_tcp_rtt_seconds_sum{shawk_role="client"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_tcp_rtt_seconds_sum{shawk_role="server", shawk_peer_agent="false"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )
      - record: shawk:dependency_rtt_seconds_count:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
              label_replace(label_replace(
                rate(shawk_tcp_rtt_seconds_count{shawk_role="client"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_tcp_rtt_seconds_count{shawk_role="server", shawk_peer_agent="false"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

      # Failures by reason (error_type): refused, timeout, unreachable,
      # local, aborted and _OTHER. Their sum is close to
      # shawk:dependency_connection_failures:rate5m, but not equal: a new
      # series of a reason emits 0 first, so that its first failures count
      # here, while those in the first sample of a new series of
      # shawk_connection_failed_total do not count there.
      - record: shawk:dependency_connection_failures_by_reason:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport, error_type) (
            label_replace(label_replace(
              rate(shawk_connection_failed_by_reason_total{shawk_role="client"}[5m]),
              "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
          )

      # The mean time to connect, from connect(2) to the SYN-ACK, is
      # handshake_sum / handshake_count. Handshakes after a lost SYN take a
      # second or more.
      - record: shawk:dependency_handshake_seconds_sum:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
            label_replace(label_replace(
              rate(shawk_tcp_handshake_seconds_sum{shawk_role="client"}[5m]),
              "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
          )
      - record: shawk:dependency_handshake_seconds_count:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
            label_replace(label_replace(
              rate(shawk_tcp_handshake_seconds_count{shawk_role="client"}[5m]),
              "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
          )

      # SYNs that the clients retransmitted, for connections established or
      # failed: a SYN or its SYN-ACK was lost, or dropped on the way.
      - record: shawk:dependency_syn_retransmits:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport) (
            label_replace(label_replace(
              rate(shawk_tcp_syn_retransmits_total{shawk_role="client"}[5m]),
              "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
          )

      # Retransmissions from both sides; shawk_role is the sender.
      - record: shawk:dependency_retransmits:rate5m
        expr: |
          sum by (src, dst, server_port, network_transport, shawk_role) (
              label_replace(label_replace(
                rate(shawk_tcp_retransmits_total{shawk_role="client"}[5m]),
                "src", "$1", "job", "(.*)"), "dst", "$1", "service_peer_name", "(.*)")
            or
              label_replace(label_replace(
                rate(shawk_tcp_retransmits_total{shawk_role="server"}[5m]),
                "dst", "$1", "job", "(.*)"), "src", "$1", "service_peer_name", "(.*)")
          )

  # The family per peer host (peer_hosts: true in the connector), counted
  # once per metric as above. src_host is the host of the client and
  # dst_host that of the server: on the client side its instance (the host
  # name) and its shawk_peer_host, on the server side the other way round.
  # A peer whose host is not certain is ~unknown, or ~external for a public
  # address. With networks in the connector, src_network and dst_network
  # are the networks of the addresses of the client and of the server, from
  # shawk_local_network and shawk_peer_network of the side counted; without
  # networks, they are not set.
  - name: shawk-host-dependencies
    rules:
      - record: shawk:host_dependency_connections:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_connection_opened_total{shawk_role="client"}[5m]),
                "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
                "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
            or
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_connection_opened_total{shawk_role="server", shawk_peer_agent="false"}[5m]),
                "dst_host", "$1", "instance", "(.*)"), "dst", "$1", "job", "(.*)"),
                "src_host", "$1", "shawk_peer_host", "(.*)"), "src", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_peer_network", "(.*)"), "dst_network", "$1", "shawk_local_network", "(.*)")
          )

      # Failures exist on the client side only, by reason.
      - record: shawk:host_dependency_connection_failures_by_reason:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport, error_type) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
              rate(shawk_host_connection_failed_by_reason_total{shawk_role="client"}[5m]),
              "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
              "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
              "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
          )

      # The mean time to connect is handshake_sum / handshake_count.
      - record: shawk:host_dependency_handshake_seconds_sum:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
              rate(shawk_host_tcp_handshake_seconds_sum{shawk_role="client"}[5m]),
              "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
              "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
              "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
          )
      - record: shawk:host_dependency_handshake_seconds_count:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
              rate(shawk_host_tcp_handshake_seconds_count{shawk_role="client"}[5m]),
              "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
              "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
              "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
          )

      - record: shawk:host_dependency_syn_retransmits:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
            label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
              rate(shawk_host_tcp_syn_retransmits_total{shawk_role="client"}[5m]),
              "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
              "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
              "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
          )

      # Bytes from the client to the server, and from the server to the
      # client.
      - record: shawk:host_dependency_request_bytes:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_network_io_bytes_total{shawk_role="client", network_io_direction="transmit"}[5m]),
                "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
                "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
            or
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_network_io_bytes_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="receive"}[5m]),
                "dst_host", "$1", "instance", "(.*)"), "dst", "$1", "job", "(.*)"),
                "src_host", "$1", "shawk_peer_host", "(.*)"), "src", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_peer_network", "(.*)"), "dst_network", "$1", "shawk_local_network", "(.*)")
          )
      - record: shawk:host_dependency_response_bytes:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport) (
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_network_io_bytes_total{shawk_role="client", network_io_direction="receive"}[5m]),
                "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
                "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
            or
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_network_io_bytes_total{shawk_role="server", shawk_peer_agent="false", network_io_direction="transmit"}[5m]),
                "dst_host", "$1", "instance", "(.*)"), "dst", "$1", "job", "(.*)"),
                "src_host", "$1", "shawk_peer_host", "(.*)"), "src", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_peer_network", "(.*)"), "dst_network", "$1", "shawk_local_network", "(.*)")
          )

      # Retransmissions from both sides; shawk_role is the sender.
      - record: shawk:host_dependency_retransmits:rate5m
        expr: |
          sum by (src_host, src, src_network, dst_host, dst, dst_network, server_port, network_transport, shawk_role) (
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_tcp_retransmits_total{shawk_role="client"}[5m]),
                "src_host", "$1", "instance", "(.*)"), "src", "$1", "job", "(.*)"),
                "dst_host", "$1", "shawk_peer_host", "(.*)"), "dst", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_local_network", "(.*)"), "dst_network", "$1", "shawk_peer_network", "(.*)")
            or
              label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(
                rate(shawk_host_tcp_retransmits_total{shawk_role="server"}[5m]),
                "dst_host", "$1", "instance", "(.*)"), "dst", "$1", "job", "(.*)"),
                "src_host", "$1", "shawk_peer_host", "(.*)"), "src", "$1", "service_peer_name", "(.*)"),
                "src_network", "$1", "shawk_peer_network", "(.*)"), "dst_network", "$1", "shawk_local_network", "(.*)")
          )

  - name: shawk-alerts
    rules:
      # A push over OTLP has no scrape `up`. This finds hosts that sent in
      # the last 24 hours but not now. Pushed series disappear 5 minutes
      # after their last sample (there is no staleness marker), so the alert
      # fires about 5 minutes after an agent stops and resolves by itself
      # after 24 hours; the Grafana alert on shawk_v1.agents takes over then.
      #
      # Nodes that Slurm stopped as planned are not alerted (docs/design.md
      # §5.7): powered down, powering down or powering up by power saving,
      # with no flag but IDLE, ALLOCATED, MIXED, CLOUD and POWER_DOWN besides
      # (so never DOWN, DRAIN, FAIL or not responding, IDLE*), or in a
      # reservation with the flag MAINT, which ends with the reservation.
      # Powering up ends as the node is up, when its agent is expected
      # within the minute of `for`, or at the ResumeTimeout of Slurm, when
      # the node is DOWN. The states come from a Slurm exporter, joined on
      # the host name; without one the `unless` removes nothing. The example
      # assumes slurm_node_state{node="<NodeName>", state="<flags joined by
      # +>"} 1 for the current state of every node: replace the metric, its
      # labels and the mapping of NodeName to host_name (here the same; e.g.
      # "$1.cluster.example" to add a domain) with those of the exporter in
      # use. A state is current only while the exporter is scraped:
      # Prometheus marks its series stale as soon as they are gone, so a
      # stale state stops nothing.
      - alert: ShawkAgentDown
        expr: |
          (
            group by (host_name) (max_over_time(shawk_agent_up[24h]))
              unless group by (host_name) (shawk_agent_up)
          )
          unless on (host_name) group by (host_name) (
            label_replace(
                slurm_node_state{state=~"(?i)((idle|allocated|mixed|cloud|power_down)[+])*(powered_down|powering_down|powering_up)([+](idle|allocated|mixed|cloud|power_down|powered_down|powering_down|powering_up))*"} == 1
              or
                slurm_node_state{state=~"(?i)(.*[+])?(maint|maintenance)([+].*)?"} == 1,
              "host_name", "$1", "node", "(.*)")
          )
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} stopped sending"
          description: "No metrics from the shawk agent on {{ $labels.host_name }}; dependencies of the host are not observed."

      - alert: ShawkFlowsDropped
        expr: increase(shawk_agent_flows_dropped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} drops flows"
          description: "The in-kernel flow table is full; raise -max-flows of the agent."

      # The kernel reports new cgroups through a ring buffer of about 500
      # events; a burst of new cgroups, such as a node starting many pods,
      # can overflow it.
      - alert: ShawkCgroupEventsDropped
        expr: increase(shawk_agent_cgroup_events_dropped_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} misses new cgroups"
          description: "The kernel dropped the events of some new cgroups; the flows of those removed within an interval are named by cgroup id instead of their service."

      - alert: ShawkContainerReadsDropped
        expr: increase(shawk_agent_container_reads_dropped_total[10m]) > 0
        labels:
          severity: info
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} reads containers late"
          description: "More new containers than the agent could queue to read; those removed before their flows are exported are named by id."

      - alert: ShawkUDPNotTraced
        expr: shawk_agent_udp_traced == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} does not trace UDP"
          description: "The kernel lacks BPF trampolines (fentry), and the kprobes that stand in for them did not attach; UDP dependencies of the host are not observed."

      - alert: ShawkUnixNotTraced
        expr: shawk_agent_unix_traced == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} does not trace Unix sockets"
          description: "Neither the BPF trampolines nor the fallback kprobes for Unix sockets attached; dependencies of the host on its Unix sockets are not observed."

      - alert: ShawkProtocolsNotClassified
        expr: shawk_agent_protocols_classified == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} does not classify wire protocols"
          description: "The agent was asked to classify the wire protocols of TCP connections (-classify-protocols), but the kernel lacks BPF trampolines (fentry) or the program did not attach; the protocols of its connections are not recorded."

      - alert: ShawkExportFailures
        expr: increase(shawk_agent_export_failures_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "shawk agent on {{ $labels.host_name }} fails to send"
          description: "The agent could not reach the collector; dependencies that end while it cannot send may be lost."

      # Connects to Unix sockets that no listener serves (dst ~unresolved)
      # are left out: glibc tries the socket of nscd, which most hosts do not
      # run, from every process that looks up a user or a host, and other
      # programs probe optional services the same way.
      - alert: ShawkConnectionFailureRate
        expr: |
          (
            shawk:dependency_connection_failures:rate5m
              / (shawk:dependency_connections:rate5m + shawk:dependency_connection_failures:rate5m) > 0.05
          )
          unless on (network_transport, dst)
            label_replace(label_replace(vector(1), "network_transport", "unix", "", ""), "dst", "~unresolved", "", "")
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.src }} fails to connect to {{ $labels.dst }}:{{ $labels.server_port }}"
          description: "{{ $value | humanizePercentage }} of the connections of {{ $labels.src }} to {{ $labels.dst }} on port {{ $labels.server_port }} fail."

  # The baseline of dependencies (docs/design.md §5.9 and §6.4): a connector
  # with baseline_file tells, every write interval, the dependencies of the
  # services of the baseline that it does not hold, over the last hour up
  # to 5 minutes ago. shawk_baseline_drift_hosts has one series per service
  # (job), server (service_peer_name), port and transport, whatever the
  # number of hosts, which is its value: a release that opens a new
  # connection on every host of a service is one alert, not one per host.
  # The series carry no address and no host; shawk-policy drift lists them.
  #
  # No drift is an answer only where the drift is known. Three alerts tell
  # where it is not: ShawkBaselineNotEvaluated (no connector evaluates it),
  # ShawkBaselineHostsNotObserved (a host that runs a service was not
  # observed) and ShawkBaselineServiceWithoutHosts (no host is known to run
  # a service of the baseline).
  #
  # The alerts take the maximum over what several connectors send, which
  # read the same PostgreSQL. A service without a baseline has no series
  # and is not judged: shawk_baseline_dependencies{job} tells the services
  # that have one, so that `absent(shawk_baseline_dependencies{job="..."})`
  # alerts when a service that must have one is not in the file. A service
  # that is renamed is a new service without a baseline, which
  # ShawkNewServiceWithoutBaseline tells once, when it appears.
  - name: shawk-baseline
    rules:
      # server_port is 0 for a dependency on a port that changes at every
      # run of its server: one that the kernel chose for it, which the file
      # of the baseline writes `port: kernel-chosen`, and one under the
      # rules of ports of the connector. The text of the alerts says so in
      # the place of "port 0".
      #
      # A dependency that the baseline does not hold, on a server that shawk
      # names: a service, a range of peer_cidrs, or ~external.
      #
      # The alert holds for 30 minutes after the last series of the drift:
      # the connector sends the drift it last knew for as long as its
      # evaluations fail, but a connector that stops sends nothing, and a
      # drift does not end because nothing evaluates it any more.
      # ShawkBaselineNotEvaluated fires within 20 minutes of the last
      # evaluation, before this one resolves. A drift that is approved, or
      # that ends, resolves 30 minutes after its last series as well.
      - alert: ShawkBaselineDrift
        expr: |
          max by (job, service_peer_name, server_port, network_transport) (
            last_over_time(shawk_baseline_drift_hosts{service_peer_name!="~unresolved"}[30m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} connects to {{ $labels.service_peer_name }}{{ if eq $labels.server_port \"0\" }} ({{ $labels.network_transport }}) on a port that changes at every run{{ else }}:{{ $labels.server_port }}/{{ $labels.network_transport }}{{ end }}, which its baseline does not hold"
          description: "{{ $value }} hosts of {{ $labels.job }} opened connections to {{ $labels.service_peer_name }} on {{ if eq $labels.server_port \"0\" }}a port that changes at every run of the server (one that the kernel chose for it, or one under the rules of ports of the connector: server_port is 0 for both){{ else }}port {{ $labels.server_port }}{{ end }} ({{ $labels.network_transport }}) within the last hour, and the approved baseline of the service has no such dependency. `shawk-policy drift -service {{ $labels.job }}` lists the hosts and the addresses, the ports that were seen, and the process when it is one of another name in a unit of the service; approve the dependency in the baseline file of the connector if it is meant."

      # The same on a private address that shawk cannot name: a host
      # without an agent, or a server whose agent is stopped and whose
      # listener is not known. It may be a server of the baseline at an
      # address that shawk does not know of, so it is a warning, and waits.
      - alert: ShawkBaselineDriftUnresolved
        expr: |
          max by (job, service_peer_name, server_port, network_transport) (
            last_over_time(shawk_baseline_drift_hosts{service_peer_name="~unresolved"}[30m])
          ) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} connects to an address that shawk cannot name, on {{ if eq $labels.server_port \"0\" }}a port that changes at every run ({{ $labels.network_transport }}){{ else }}port {{ $labels.server_port }}/{{ $labels.network_transport }}{{ end }}, which its baseline does not hold"
          description: "{{ $value }} hosts of {{ $labels.job }} opened connections to private addresses without a known service on {{ if eq $labels.server_port \"0\" }}a port that changes at every run of the server (one that the kernel chose for it, or one under the rules of ports of the connector){{ else }}port {{ $labels.server_port }}{{ end }} ({{ $labels.network_transport }}). `shawk-policy drift -service {{ $labels.job }}` lists the addresses: name their range in peer_cidrs, run an agent there, or approve ~unresolved on the port."

      # No drift is an answer only while the drift is evaluated. A connector
      # with baseline_file sends when its last evaluation succeeded, from
      # its first attempt: 0 before any succeeded, so that one that never
      # evaluated alerts too. The time is kept for 30 days after the last
      # connector stopped sending it, so the alert fires for as long after
      # baseline_file is taken out of every connector on purpose: silence
      # it then. Evaluations run every 5 minutes: the alert fires within 20
      # minutes of the last one, before a drift that was firing resolves
      # (30 minutes), and is critical as that drift is, since it stands for
      # every drift that is no longer told.
      #
      # Where no connector with baseline_file ever sent to this Prometheus,
      # no series tells that one should: nothing in these rules knows that
      # a baseline is meant to be evaluated. Where it is, add an alert on
      # `absent(shawk_baseline_evaluation_timestamp_seconds)`.
      - alert: ShawkBaselineNotEvaluated
        expr: time() - max(last_over_time(shawk_baseline_evaluation_timestamp_seconds[30d])) > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "the drift from the baseline of dependencies is not evaluated"
          description: "No connector evaluated the drift from the baseline in the last 15 minutes ({{ if gt $value 1e9 }}none ever did since it started{{ else }}the last evaluation was {{ $value | humanizeDuration }} ago{{ end }}): PostgreSQL cannot be read, the evaluation takes more than its minute, or the connectors with baseline_file are stopped. A dependency that the baseline does not hold is not alerted meanwhile, and an alert of a drift that was firing resolves by itself."

      # A host that runs a service of the baseline was not observed for the
      # whole period that was evaluated: its agent is stopped, it restarted
      # for longer than 3 minutes (a host counts as observed for 3 minutes
      # after a report of its agent), or its clock is behind. What the
      # service did there is not known, and no drift is no answer for it. A
      # host runs a service for baseline_host_memory (a week) after a
      # process of the service was last seen on it: one that was removed
      # counts until then, unless the same host name reports again under a
      # new machine id (a host that was installed again), which replaces
      # it. A restart of the host is not observed for the hour that holds
      # it: the alert then lasts that long. A service that no host runs is
      # judged on the hosts that ran it last: one of them that is silent
      # may run it still, and counts here for as long as it is silent.
      - alert: ShawkBaselineHostsNotObserved
        expr: max by (job) (shawk_baseline_hosts_unobserved) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} hosts that run {{ $labels.job }}, or ran it last, were not observed: its drift from the baseline is not known"
          description: "{{ $value }} hosts on which a process of {{ $labels.job }} was seen in the last week, or which ran it last if no host runs it now, were not observed by their agent for the whole of the last hour: an agent that is stopped, a restart of more than 3 minutes within the hour, or a clock that is behind. A dependency that the baseline does not hold is not told for them. `shawk-policy drift -service {{ $labels.job }}` lists the hosts with how long each was not observed: start their agents, or wait for baseline_host_memory if they were removed. A service that runs on no host and whose last host is gone for good stays here until it is taken out of the baseline file."

      # Nothing judges a service of the baseline: no process of it was ever
      # seen on a host that is still known. The service was renamed, or
      # its name is mistyped. A service that simply does not run now, as a
      # monthly job or a tool that ran once, is judged on the hosts that
      # ran it last (shawk_baseline_hosts counts them): where they are
      # observed it did nothing and no alert fires, and where one is not,
      # ShawkBaselineHostsNotObserved does.
      - alert: ShawkBaselineServiceWithoutHosts
        expr: max by (job) (shawk_baseline_hosts) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "no host is known to run or to have run {{ $labels.job }}, which has a baseline: nothing judges it"
          description: "No process of {{ $labels.job }} was ever seen on a host that is still known. Its baseline judges nothing: check the name of the service, or take it out of the baseline file."

      - alert: ShawkBaselineFileInvalid
        expr: max(shawk_baseline_file_failed) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "the baseline of PostgreSQL does not follow the baseline file of a connector"
          description: "The latest read of a baseline_file failed (shawk_v1.baseline_status tells why), or the file is valid and could not be written to PostgreSQL (the log of the connector tells why): the baseline written before stays, so a change that was approved in the file does not hold yet, and nothing is judged if none was written."

      # More dependencies drift than the connector sends series for (20 per
      # service, 1000 in all): the others are in no series, and alert
      # nothing. Those on a peer that shawk names would each be critical,
      # so not telling them is.
      - alert: ShawkBaselineDriftTruncated
        expr: max(shawk_baseline_drift_truncated{shawk_baseline_peer="named"}) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} dependencies on named peers that drift from the baseline are not told"
          description: "More dependencies on services, ranges of peer_cidrs or ~external are missing from their baseline than the connector sends series for (20 per service, 1000 in all); `shawk-policy drift` lists them all. A baseline taken before the agents traced UDP, or a peer that was renamed, makes many at once."

      # The same on ~unresolved: a process that tries many ports of private
      # addresses makes them.
      - alert: ShawkBaselineDriftUnresolvedTruncated
        expr: max(shawk_baseline_drift_truncated{shawk_baseline_peer="unresolved"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} dependencies on addresses that shawk cannot name, which drift from the baseline, are not told"
          description: "More dependencies on ~unresolved are missing from their baseline than the connector sends series for (20 per service, 1000 in all); `shawk-policy drift` lists them all. A process that tries the ports of a private address makes many at once."

      # A service without a baseline that appeared within the last hour. A
      # new executable is a service of its own (docs/design.md §4.1). In a
      # unit that runs a service of the baseline it is judged as that
      # service; anywhere else no baseline judges it: an administrator who
      # runs a tool, or a process that should not be there.
      - alert: ShawkNewServiceWithoutBaseline
        expr: max(shawk_baseline_new_services) > 0
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} new services opened connections, and no baseline judges them"
          description: "Services that were first seen within the last hour opened connections and have no baseline. `shawk-policy drift` lists them with their hosts."
