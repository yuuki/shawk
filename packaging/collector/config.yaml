# Configuration of the collector with the shawk connector (built from
# collector/builder-config.yaml). Agents send to otlp/shawk; OBI and other
# instrumentation send to otlp.
#
# Both receivers require TLS with client certificates: what they receive is
# written to PostgreSQL or Prometheus, where a forged shawk_agent_up would
# silence alerts. Each receiver trusts its own CA, so that a certificate of
# OBI, which often runs on hosts or in containers trusted less than the
# agents, is refused by the receiver of agents. The files must be readable
# by the user of the collector (shawk-collector; 65532 in the container
# image).
receivers:
  # shawk agents only (-otlp-cert-file and -otlp-key-file). A request of an
  # agent stays below 3 MiB; the limits leave room. gRPC only: the connector
  # checks the client certificate of every request (host_identity), which
  # the receiver passes on over gRPC, not over HTTP.
  otlp/shawk:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4327
        max_recv_msg_size_mib: 16
        tls:
          cert_file: /etc/shawk/tls/collector.crt
          key_file: /etc/shawk/tls/collector.key
          client_ca_file: /etc/shawk/tls/agents-ca.crt
  # OBI and other instrumentation, with the variables of the OpenTelemetry
  # SDK: OTEL_EXPORTER_OTLP_ENDPOINT=https://..., OTEL_EXPORTER_OTLP_CERTIFICATE,
  # OTEL_EXPORTER_OTLP_CLIENT_CERTIFICATE and OTEL_EXPORTER_OTLP_CLIENT_KEY.
  # Their certificates come from another CA than those of the agents.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls: &obi_tls
          cert_file: /etc/shawk/tls/collector.crt
          key_file: /etc/shawk/tls/collector.key
          client_ca_file: /etc/shawk/tls/obi-ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls: *obi_tls

connectors:
  shawk:
    postgres:
      # A connection string of the role shawk_connector that verifies the
      # certificate of the server against the CA in sslrootcert (without
      # sslrootcert, the CAs of the system), e.g.
      # postgres://shawk_connector:PASSWORD@db.example:5432/shawk?sslmode=verify-full&sslrootcert=/etc/shawk/tls/postgres-ca.crt
      dsn_file: /etc/shawk/postgres-dsn
      migrate: false          # apply the schema with shawk-migrate
    write_interval: 1m
    idle_ttl: 15m
    max_peers: 50
    # Local services per host with a job of their own in Prometheus; the
    # others share the job ~other. PostgreSQL keeps them all.
    max_services: 200
    peer_cidrs:
      office-lan: 192.168.10.0/24
    # The hosts expected in a static cluster, with all their addresses,
    # roles and node names in Slurm, read every write_interval
    # (docs/design.md, section 5.6). shawk_v1.never_observed() reports the
    # hosts whose agent never reported.
    # inventory_file: /etc/shawk/inventory.yaml
    # Relays without an agent that rewrite addresses: load balancers,
    # keepalived/LVS virtual addresses, TCP proxies. The client edges to
    # their virtual addresses are matched with the server edges of their
    # backends (docs/design.md, section 5.4).
    # translations:
    #   postgres-vip:
    #     virtual: [10.0.100.1:5432]
    #     backends: [10.0.1.10, 10.0.1.11]   # without a port: the port of the client
    #     transport: tcp
    #   web-lb:
    #     virtual: ["10.0.100.2:80", "[2001:db8::2]:80"]
    #     backends: [10.0.1.0/24:8080]
    #     sources: [10.0.100.250]            # what the backends see the clients at
    keep_peer_address: false
    # Metrics per peer host (shawk_host_*, with shawk_peer_host), besides
    # the others, e.g. for an HPC cluster where the hosts of a service have
    # different roles (docs/design.md, section 5.3). They multiply the
    # series with the hosts each service talks to: measure before enabling
    # them widely, and restrict them to the dependencies of some services
    # (at either end). Every connector of a fleet needs the same settings.
    # peer_hosts: true
    # max_peer_hosts: 500                   # per host, service, role and peer service
    # peer_host_services: [slurmctld, prometheus]
    # The networks of the local and the peer address of each edge, on the
    # metrics per peer host (shawk_local_network, shawk_peer_network), e.g.
    # to see NFS traffic that goes over the management network; they need
    # peer_hosts. They name addresses, not paths or interfaces; those of
    # Unix sockets, which have no address, carry none.
    # networks:
    #   mgmt: 10.0.0.0/16
    #   ib: 10.10.0.0/16
    #   storage: 10.20.0.0/16, fd00:20::/48
    # The certificate of an agent must name its host as `hostname` prints
    # it (a DNS name, or the common name of a certificate without DNS
    # names): an agent cannot write as another host.
    host_identity: certificate
    retention: 26280h         # 3 years; 0 keeps rows forever
    # The users of the processes of Slurm jobs, from agents run with
    # -job-users (docs/design.md, section 6). For administrators only:
    # grants.sql keeps shawk_v1.job_edges from Grafana.
    job_users: false
    # Bounds of what the connector holds (docs/design.md, section 5.5), far
    # above a large fleet. Lower max_hosts to the size of the fleet, with
    # room, to bound the memory of the collector more tightly.
    max_hosts: 10000
    max_series_per_host: 100000   # edges, listeners, translations and addresses
    max_pending_rows: 10000000    # kept while PostgreSQL cannot be written
    # States of nodes from Slurm, generated every minute by a cron job, and
    # maintenance windows registered by hand; they tell why hosts were not
    # observed and which stopped agents are planned (docs/design.md,
    # section 5.7).
    # node_states_file: /etc/shawk/node-states.json
    # maintenance_file: /etc/shawk/maintenance.yaml
    # Servers that listen on a port chosen anew at every run, such as srun
    # and salloc of Slurm without SrunPortRange: their dependencies are
    # aggregated without the port (server_port 0 in Prometheus, port 0 in
    # the dependencies between services and their changes in PostgreSQL),
    # by service name or by ranges of ports of the servers (docs/design.md,
    # section 5.3). The edges in PostgreSQL keep their ports.
    # port_agnostic_services: [srun, salloc, slurm-job]   # slurm-job: the processes of jobs
    # dynamic_ports:
    #   srun:
    #     hosts: [10.1.0.0/16]    # the addresses of the servers; empty for every host
    #     transport: tcp          # empty for both
    #     ports: 60001-63000      # SrunPortRange; or a single port, quoted: "50000"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  # Prometheus started with --web.enable-otlp-receiver and the web
  # configuration of packaging/prometheus/web.yml: over TLS, as a user of
  # its basic_auth_users. Whoever can push to Prometheus can write
  # shawk_agent_up and silence the alerts on agents. The header, "Basic "
  # and the base64 of user:password, comes from the environment
  # (/etc/shawk/collector.env), not from this file. A Prometheus that
  # requires client certificates instead takes tls.cert_file and
  # tls.key_file here.
  otlp_http/prometheus:
    endpoint: https://prometheus.example:9090/api/v1/otlp
    tls:
      ca_file: /etc/shawk/tls/prometheus-ca.crt
    headers:
      Authorization: ${env:SHAWK_PROMETHEUS_AUTHORIZATION}
  # Tempo or another trace store, over TLS with the client certificate of
  # the collector, which the store should require: in Tempo,
  # tls.client_ca_file of the otlp receiver of the distributor.
  otlp_grpc/traces:
    endpoint: tempo.example:4317
    tls:
      ca_file: /etc/shawk/tls/tempo-ca.crt
      cert_file: /etc/shawk/tls/collector-client.crt
      key_file: /etc/shawk/tls/collector-client.key

service:
  pipelines:
    # No batch processor before the connector: one request of an agent is
    # one interval of its host.
    metrics/shawk-in:
      receivers: [otlp/shawk]
      processors: [memory_limiter]
      exporters: [shawk]
    # The connector stamps its outputs with its own clock, so that they can
    # be batched.
    metrics/shawk-out:
      receivers: [shawk]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    # No batch processor: points carry the clock of their host, and
    # Prometheus rejects a whole request if one point is too far off, which
    # would drop the metrics of every host batched with it.
    metrics/obi:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/prometheus]
    traces/obi:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/traces]
