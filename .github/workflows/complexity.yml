name: Complexity

# Measures Cognitive Complexity (SonarSource) and Cyclomatic Complexity (McCabe)
# with cccc (https://github.com/moznion/cccc) and tracks them as custom metrics
# in octocov (https://github.com/k1LoW/octocov): a pull request gets a comment
# comparing them with main, and each push to main stores a report in the
# octocov branch. Nothing fails on a score; what is analyzed is configured in
# cccc.toml, and the octocov settings are in .octocov.complexity.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity:
    name: Measure complexity
    runs-on: ubuntu-latest
    permissions:
      contents: write # octocov stores the reports in the octocov branch
      pull-requests: write # octocov comments on the pull request
      actions: read # octocov reads the workflow run
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Measure complexity (cccc)
        uses: moznion/cccc-action@v1.1.2
        with:
          version: v1.8.6
          path: .
          output-file: cccc.json

      # Turn the summary of cccc into octocov custom metrics:
      # https://github.com/k1LoW/octocov#custom-metrics
      - name: Build octocov custom metrics
        run: |
          jq '{
            key: "code_complexity",
            name: "Code Complexity",
            metrics: [
              { key: "function_count",    name: "Function count",     value: .summary.function_count },
              { key: "cognitive_sum",     name: "Cognitive: total",   value: .summary.cognitive.sum },
              { key: "cognitive_max",     name: "Cognitive: max",     value: .summary.cognitive.max },
              { key: "cognitive_median",  name: "Cognitive: median",  value: .summary.cognitive.median },
              { key: "cognitive_p90",     name: "Cognitive: p90",     value: .summary.cognitive.p90 },
              { key: "cyclomatic_sum",    name: "Cyclomatic: total",  value: .summary.cyclomatic.sum },
              { key: "cyclomatic_max",    name: "Cyclomatic: max",    value: .summary.cyclomatic.max },
              { key: "cyclomatic_median", name: "Cyclomatic: median", value: .summary.cyclomatic.median },
              { key: "cyclomatic_p90",    name: "Cyclomatic: p90",    value: .summary.cyclomatic.p90 }
            ]
          }' cccc.json > custom_metrics_complexity.json
          echo "::group::custom_metrics_complexity.json"
          cat custom_metrics_complexity.json
          echo "::endgroup::"

      # For people: the hotspots behind the numbers.
      - name: Write job summary
        run: |
          {
            echo "## Top 20 functions by cognitive complexity"
            echo
            jq -r '.summary | select(.parse_error_file_count > 0)
              | "\(.parse_error_count) parse error(s) in \(.parse_error_file_count) file(s); results for those files may be partial.\n"' cccc.json
            echo "| Cognitive | Cyclomatic | Function | File:Line |"
            echo "| ---: | ---: | --- | --- |"
            jq -r '[ .files[] | (.path | ltrimstr("./")) as $p | .functions[] | recurse(.children[]?)
                | { path: $p, name, line, cognitive, cyclomatic } ]
              | sort_by(-.cognitive, -.cyclomatic) | .[:20][]
              | "| \(.cognitive) | \(.cyclomatic) | `\(.name)` | \(.path):\(.line) |"' cccc.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track the metrics (octocov)
        uses: k1LoW/octocov-action@v1.5.2
        with:
          version: v0.83.3
          config: .octocov.complexity.yml
        env:
          OCTOCOV_CUSTOM_METRICS_COMPLEXITY: custom_metrics_complexity.json
