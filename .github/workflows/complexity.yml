name: Complexity

# Measures Cognitive Complexity (SonarSource) and Cyclomatic Complexity (McCabe)
# with cccc (https://github.com/moznion/cccc). What is analyzed, and the
# max-cognitive threshold above which the job fails, are configured in cccc.toml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  complexity:
    name: Measure complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Measure complexity (cccc)
        uses: moznion/cccc-action@1d5313811f8451953e46a268c61791a01e40b7df # v1.1.2
        with:
          version: v1.8.6
          path: .
          output-file: cccc.json

      - name: Write job summary
        # Also when the gate fails, so that the summary and the annotations name
        # the offending functions: cccc itself only exits non-zero.
        if: ${{ !cancelled() && hashFiles('cccc.json') != '' }}
        run: |
          if [ ! -s cccc.json ]; then
            echo "cccc wrote no report; see the log of the cccc step." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          max=$(sed -n 's/^max-cognitive *= *\([0-9][0-9]*\).*/\1/p' cccc.toml)
          functions='[ .files[] | (.path | ltrimstr("./")) as $p | .functions[] | recurse(.children[]?)
            | { path: $p, name, line, cognitive, cyclomatic } ] | sort_by(-.cognitive, -.cyclomatic)'
          row='"| \(.cognitive) | \(.cyclomatic) | `\(.name)` | \(.path):\(.line) |"'
          if [ -n "$max" ]; then
            jq -r --argjson max "$max" "$functions"' | .[] | select(.cognitive > $max)
              | "::error file=\(.path),line=\(.line)::\(.name): cognitive complexity \(.cognitive) exceeds max-cognitive = \($max) in cccc.toml"' cccc.json
          fi
          {
            echo "## Code complexity (cccc)"
            echo
            jq -r '.summary | "\(.file_count) files, \(.function_count) functions."' cccc.json
            jq -r '.summary | select(.parse_error_file_count > 0)
              | "\(.parse_error_count) parse error(s) in \(.parse_error_file_count) file(s); results for those files may be partial."' cccc.json
            echo
            echo "| Metric | Sum | Max | Median | p90 | p95 |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: |"
            jq -r '.summary | (["Cognitive", .cognitive], ["Cyclomatic", .cyclomatic])
              | "| \(.[0]) | \(.[1].sum) | \(.[1].max) | \(.[1].median) | \(.[1].p90) | \(.[1].p95) |"' cccc.json
            echo
            if [ -n "$max" ]; then
              over=$(jq --argjson max "$max" "$functions"' | map(select(.cognitive > $max)) | length' cccc.json)
              if [ "$over" -eq 0 ]; then
                echo "No function exceeds \`max-cognitive = $max\` (cccc.toml)."
              else
                echo "### $over function(s) exceed \`max-cognitive = $max\` (cccc.toml)"
                echo
                echo "| Cognitive | Cyclomatic | Function | File:Line |"
                echo "| ---: | ---: | --- | --- |"
                jq -r --argjson max "$max" "$functions"' | .[] | select(.cognitive > $max) | '"$row" cccc.json
              fi
              echo
            fi
            echo "### Top 20 functions by cognitive complexity"
            echo
            echo "| Cognitive | Cyclomatic | Function | File:Line |"
            echo "| ---: | ---: | --- | --- |"
            jq -r "$functions"' | .[:20][] | '"$row" cccc.json
          } >> "$GITHUB_STEP_SUMMARY"
