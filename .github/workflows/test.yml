name: Kernel performance probe
on:
  push:
    branches: [ci/profile-kernel-tests]
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.runner }} RCU=${{ matrix.rcu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        rcu: ["0", "1"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm cpio
      - name: Inspect virtualization
        run: |
          uname -a
          lscpu
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            sudo chmod a+rw /dev/kvm
          else
            echo '/dev/kvm is absent'
          fi
      - uses: actions/cache@v6.1.0
        with:
          path: build/kernel
          key: kernel-probe-5.15-aarch64
          restore-keys: kernel-5.15-aarch64-
      - name: Measure
        env:
          RCU: ${{ matrix.rcu }}
          VM_TEST_ARGS: '-test.run=^(TestCIProfile|TestTCPIteratorSkips|TestTCPManyShortConnections|TestUDPDirection)$'
        run: |
          sed -i "s/panic=-1 quiet/panic=-1 quiet rcupdate.rcu_expedited=$RCU/" test/vm/run.sh
          time test/vm/run.sh 5.15 aarch64
