name: Test
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    # Hosted runners allow loading BPF programs with sudo, including fentry,
    # which the UDP tracing needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm rpm2cpio cpio
      - name: Vet
        run: make vet
      - name: Unit tests
        run: go test ./...
      # The tests below use the committed BPF object, which the binary embeds
      # and releases ship.
      - name: Tests loading BPF programs
        run: make test-root
      - name: End-to-end test
        run: make e2e
      - name: Compatibility with the Rocky Linux 9 kernel
        run: make compat
      - name: Check that the committed BPF object matches the source
        run: make check-object
