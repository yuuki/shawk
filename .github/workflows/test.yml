name: Test
on:
  push:
  pull_request:

jobs:
  test:
    # Hosted runners allow loading BPF programs with sudo, including fentry,
    # which the UDP tracing needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm rpm2cpio cpio
      - name: Check that the BPF object is up to date
        run: |
          go generate ./internal/tracer/
          git diff --exit-code -- internal/tracer/
      - name: Vet
        run: make vet
      - name: Unit tests
        run: go test ./...
      - name: Tests loading BPF programs
        run: make test-root
      - name: End-to-end test
        run: make e2e
      - name: Compatibility with the Rocky Linux 9 kernel
        run: make compat
