# golangci-lint v2 (the version is pinned in the Makefile and in
# .github/workflows/test.yml). make lint runs it in every Go module that
# builds with Go alone (., collector, test/packaging); paths below are
# relative to this file.
version: "2"
linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # Unhandled errors are errcheck's, which leaves out the Close of
        # cleanup paths (std-error-handling); G104 would report every one.
        - G104
        # Every integer conversion: here of kernel and BPF values of fixed
        # widths (inode numbers, ports, counters) and of values checked to
        # be in range before the conversion.
        - G115
    staticcheck:
      checks:
        - all
        # The defaults of golangci-lint: package comments, initialisms and
        # comment forms that the code does not follow.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Suggested rewrites that would make the code harder to read: a
        # negated character class in De Morgan's form, and selectors
        # without the embedded fields they name on purpose, e.g.
        # out[i].FlowStats.Add(...), which tells what part of a flow changes.
        - -QF1001
        - -QF1008
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx]
      # Developer tools that are not shipped: the load generators of
      # test/nodeload, the init of the test VM and the tool that writes the
      # notices. Their calls are best effort by design (writes to peers that
      # may be gone, signals to children that may have exited), they run
      # the commands they are given and write files for everyone to read.
      - path: ^(test/nodeload|test/vm/init|scripts/third-party-notices)/
        linters: [gosec, errcheck, noctx]
formatters:
  enable:
    - gofmt
